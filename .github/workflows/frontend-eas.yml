name: Frontend EAS (build or update)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options:
          - build
          - update
        required: true
      message:
        description: "Update message (only used for the 'update' action)"
        type: string
        required: false
        default: ""

concurrency:
  group: frontend-eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    if: ${{ inputs.action == 'build' }}
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx eas-cli whoami --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (iOS, cloud)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform ios --profile production --non-interactive --wait

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Inject App Store Connect submit config
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'eas.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.submit = config.submit || {};
            config.submit.production = {
              ios: {
                ascAppId: process.env.ASC_APP_ID,
                ascApiKeyId: process.env.ASC_API_KEY_ID,
                ascApiKeyIssuerId: process.env.ASC_API_KEY_ISSUER_ID,
                ascApiKeyPath: '${{ runner.temp }}/asc/AuthKey.p8',
              },
            };
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          "

      - name: Submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli submit --platform ios --profile production --latest --non-interactive

  update:
    if: ${{ inputs.action == 'update' }}
    needs: test
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli update \
            --channel production \
            --message "${{ inputs.message || github.event.head_commit.message || 'Manual update' }}" \
            --non-interactive
